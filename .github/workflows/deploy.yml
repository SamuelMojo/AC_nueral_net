name: Deploy Telemetry Dashboard to AWS

on:
  push:
    branches: [ "main" ]

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Dependencies & Check Syntax
      run: |
        python -m pip install --upgrade pip
        pip install streamlit pandas plotly ollama pyarrow pytest

    # Deployment is done by the watchdog on the server (~/auto_pull.sh): it polls GitHub every
    # 30s, pulls new commits and restarts the dashboard. No SSH key is stored in GitHub.
    - name: Post-Deployment Smoke Test
      run: |
        echo "Waiting 45s for the server watchdog to pull and restart the dashboard..."
        sleep 45
        echo "Testing site availability..."
        for i in {1..6}; do
          response=$(curl -s -o /dev/null -w "%{http_code}" https://telemetry.samuelojo.tech)
          if [ "$response" = "200" ]; then
            echo "Dashboard is live and returning 200 OK!"
            exit 0
          fi
          echo "Attempt $i: Received HTTP $response, retrying in 5 seconds..."
          sleep 5
        done
        echo "Error: Dashboard did not return 200 OK in time."
        exit 1